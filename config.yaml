# ============================================================
#  CoD Montage Generator - settings
#  Times are in seconds. Screen regions are fractions (0.0-1.0)
#  of the frame, so they work at any resolution.
#
#  Quick overrides without editing this file:
#    command line:  --platform shorts --style hype --game mw --length 60
#    env variables: MONTAGE_PLATFORM, MONTAGE_STYLE, MONTAGE_GAME, MONTAGE_LENGTH
#  Priority: command line > env variable > this file.
# ============================================================

# Which game the recordings are from (picks the screen-region preset).
# Options: codm, mw, bo, warzone, generic
game: codm

# Where the montage is going. Sets shape, resolution, length and pacing.
# Options: youtube, shorts, reels, tiktok, instagram_feed
platform: youtube

# Editing personality. Options: cinematic, hype, clean
style: cinematic

# Your name / channel name for the intro title card.
gamer_name: "Player"

# ---------- folders (relative to this file) ----------
paths:
  assets: assets
  music: music
  overlays: overlays
  work: work
  review: review
  output: output

# ---------- hardware ----------
hardware:
  # auto = try NVIDIA (nvenc) -> Intel Quick Sync (qsv) -> AMD (amf) -> CPU (x264)
  # or force one of: nvenc, qsv, amf, x264
  encoder: auto
  # Let the GPU decode recordings when it can (falls back to CPU per file).
  hw_decode: true
  # Full path to ffmpeg.exe if it isn't on PATH, e.g. "C:/ffmpeg/bin/ffmpeg.exe".
  # ffprobe.exe is expected in the same folder.
  ffmpeg_path: ""

# ---------- stage 1: ingest ----------
ingest:
  extensions: [".mp4", ".mkv", ".mov", ".webm", ".avi", ".ts", ".3gp"]
  # Small copies used only for analysis. The short side is scaled to this.
  proxy_height: 480
  # Frames per second in the proxy. 10 is enough to catch hitmarkers.
  proxy_fps: 10
  # Audio extracted for analysis (mono WAV).
  audio_sample_rate: 22050
  # Recordings shorter than this are skipped.
  min_duration: 10

# ---------- stage 2: candidate detection ----------
detection:
  weight_audio: 1.0
  weight_kills: 2.0
  # Multi-kill: this many kills inside this window gets a bonus.
  multikill_min_kills: 2
  multikill_window: 6.0
  multikill_bonus: 3.0
  # Padding around a highlight.
  lead_in: 2.5
  lead_out: 1.5
  # Highlights closer than this are merged into one clip.
  merge_gap: 3.0
  # Longest candidate clip; longer action keeps its best-scoring window.
  max_clip_len: 15
  # How many top clips go to the review step.
  max_candidates: 40

  # --- event thresholds (higher = stricter). Tune with work/videos/<name>/signals.csv
  # Kill indicator strength needed to count a kill (robust z-score).
  kill_z: 5.0
  # Same for hitmarkers around the crosshair.
  hitmarker_z: 5.0
  # Two kill events closer than this are treated as one.
  event_debounce: 1.0
  # Loud fights without a detected kill still become clips above this (0-1).
  audio_peak: 0.85

  # --- excluding menus, loading screens, death screens
  # Average pixel change per frame (0-255) below which the screen counts as frozen.
  static_motion: 1.0
  # ...for at least this long.
  static_min_seconds: 3
  # Brightness (0-255) below which a frame counts as black/loading.
  dark_level: 18
  # Contrast below which a frame counts as a flat colour screen.
  uniform_std: 8
  # Saturation below this fraction of the recording's normal = grey death/spectate screen.
  desat_ratio: 0.45
  # PySceneDetect sensitivity for hard cuts (lower = more cuts).
  scene_threshold: 27

# Screen regions: [x, y, width, height] from the top-left corner.
# These are starting guesses - they get tuned on real footage in stage 2.
regions:
  codm:
    kill_feed:   [0.00, 0.30, 0.28, 0.25]   # left side, under the minimap
    kill_banner: [0.35, 0.55, 0.30, 0.20]   # skull / "+100" popup below crosshair
    hitmarker:   [0.46, 0.44, 0.08, 0.12]   # around the crosshair
    medals:      [0.35, 0.15, 0.30, 0.20]
  mw:
    kill_feed:   [0.00, 0.62, 0.30, 0.20]
    kill_banner: [0.40, 0.55, 0.20, 0.15]
    hitmarker:   [0.46, 0.44, 0.08, 0.12]
    medals:      [0.38, 0.62, 0.24, 0.18]
  bo:
    kill_feed:   [0.00, 0.62, 0.30, 0.20]
    kill_banner: [0.40, 0.55, 0.20, 0.15]
    hitmarker:   [0.46, 0.44, 0.08, 0.12]
    medals:      [0.38, 0.62, 0.24, 0.18]
  warzone:
    kill_feed:   [0.00, 0.62, 0.30, 0.20]
    kill_banner: [0.40, 0.55, 0.20, 0.15]
    hitmarker:   [0.46, 0.44, 0.08, 0.12]
    medals:      [0.38, 0.62, 0.24, 0.18]
  generic:
    kill_feed:   [0.00, 0.30, 0.30, 0.50]
    kill_banner: [0.30, 0.50, 0.40, 0.25]
    hitmarker:   [0.45, 0.42, 0.10, 0.16]
    medals:      [0.30, 0.15, 0.40, 0.25]

# ---------- stage 3: review ----------
review:
  # Frames per contact sheet and how many per row.
  frames: 8
  columns: 4
  # Width of each frame on the sheet (pixels).
  tile_width: 480
  # --auto mode: clips scoring below this (0-100) are dropped.
  auto_min_score: 10

# ---------- stage 4: music ----------
music:
  # auto = rate every track in music/ (energy, drops, tempo, length fit)
  # and pick the best, rotating between runs. Or put a filename here.
  pick: auto
  # When one track is too short, the next is chained with this crossfade (seconds).
  crossfade: 3.0
  # Fade-out at the very end of the montage (seconds).
  fade_out: 2.0
  # Preferred tempo range; tracks outside it get a lower auto-pick score.
  bpm_range: [110, 175]
  # Energy jump (0-1) between the 2 bars before and after a downbeat that counts as a drop.
  drop_min_jump: 0.22

# ---------- montage length ----------
montage:
  # auto = decide inside the platform's range based on how many strong
  # clips exist (better short and great than long and padded).
  # Or a number of seconds, e.g. 240.
  length: auto
  min_clip: 3.0
  max_clip: 10.0
  # Clip length in calm vs high-energy music, before the platform/style pace.
  calm_clip: 7.0
  busy_clip: 3.5
  # Avoid clips from the same recording more than this many in a row.
  max_same_source_in_row: 1

# ---------- platforms ----------
# aspect: how landscape gameplay is fitted. "landscape" keeps it as is;
# "center_crop" crops around the crosshair (CoD keeps it centered).
# hook: put the best moment in the first `hook_seconds`.
# pace: >1 = faster cuts, <1 = longer clips.
platforms:
  youtube:
    width: 1920
    height: 1080
    aspect: landscape
    length_min: 180
    length_max: 300
    hook_seconds: 8
    pace: 1.0
  shorts:
    width: 1080
    height: 1920
    aspect: center_crop
    length_min: 30
    length_max: 60
    hook_seconds: 2
    pace: 1.3
  reels:
    width: 1080
    height: 1920
    aspect: center_crop
    length_min: 30
    length_max: 60
    hook_seconds: 2
    pace: 1.2
  tiktok:
    width: 1080
    height: 1920
    aspect: center_crop
    length_min: 20
    length_max: 45
    hook_seconds: 1.5
    pace: 1.4
  instagram_feed:
    width: 1080
    height: 1350
    aspect: center_crop
    length_min: 30
    length_max: 60
    hook_seconds: 2
    pace: 1.2

# ---------- styles ----------
# slowmo_speed: playback speed of slow motion (0.5 = half speed)
# slowmo_share: fraction of clips that get a slow-mo kill moment
# zoom_punch: zoom amount on big beats (1.0 = off); zoom_share: how often
# shake: camera shake on big kicks (0 = off)
# transitions: which transitions may be used on drops (hard cuts elsewhere)
# letterbox: cinematic black bars (only on landscape platforms)
# text_popups: "TRIPLE KILL" style text on multi-kills
# music_dropout: cut the music for a moment right before a big kill
styles:
  cinematic:
    slowmo_speed: 0.4
    slowmo_share: 0.35
    zoom_punch: 1.06
    zoom_share: 0.15
    shake: 0
    transitions: [flash, blur]
    letterbox: true
    vignette: true
    contrast: 1.08
    saturation: 1.12
    text_popups: false
    music_dropout: true
    pace: 0.85
  hype:
    slowmo_speed: 0.5
    slowmo_share: 0.2
    zoom_punch: 1.10
    zoom_share: 0.35
    shake: 6
    transitions: [flash, whip, blur]
    letterbox: false
    vignette: false
    contrast: 1.12
    saturation: 1.2
    text_popups: true
    music_dropout: true
    pace: 1.25
  clean:
    slowmo_speed: 0.5
    slowmo_share: 0.1
    zoom_punch: 1.0
    zoom_share: 0.0
    shake: 0
    transitions: [flash]
    letterbox: false
    vignette: false
    contrast: 1.04
    saturation: 1.05
    text_popups: false
    music_dropout: false
    pace: 1.0

# ---------- render ----------
render:
  fps: 30
  # Encoder quality: lower = better and bigger (x264 CRF / QSV global_quality).
  quality: 21
  audio_bitrate: 192k
  loudness_lufs: -14
  # Game audio level under the music (0-1) and how much gunshot peaks poke through.
  game_audio_level: 0.25
  game_audio_peaks: 0.5
  preview:
    scale: 0.6667          # 1080p -> 720p
    fps: 30
